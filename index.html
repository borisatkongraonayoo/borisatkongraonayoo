<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริหารจัดการ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f5f7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="webappFrame" src="" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // URL Web App จาก Google Apps Script ( URL ที่ลงท้ายด้วย /exec )
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbwtP7iFKQfR_IadOrp8qdxjlIycU8fYUhouFpb11rp1hjzM7gUA96sU7cfUpdVOGEQvYw/exec";
    const iframe = document.getElementById('webappFrame');

    // โหลดหน้าตาม Parameter ?page=...
    function loadPageFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get('page') || 'tech'; // หน้าเริ่มต้นถ้าไม่ได้ระบุค่า
      iframe.src = `${APPS_SCRIPT_EXEC_URL}?page=${page}`;
    }

    // ดักรับสัญญาณ postMessage จากปุ่มใน Apps Script เพื่อเปลี่ยนหน้า
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'CHANGE_PAGE') {
        const newPage = event.data.page;
        
        // อัปเดต URL บนแถบเบราว์เซอร์ของ GitHub Pages
        const newUrl = `${window.location.pathname}?page=${newPage}`;
        window.history.pushState({ page: newPage }, '', newUrl);

        // เปลี่ยนหน้าใน iframe
        iframe.src = `${APPS_SCRIPT_EXEC_URL}?page=${newPage}`;
      }
    });

    // ตรวจจับปุ่ม ย้อนกลับ / ถอยหน้า (Back/Forward) ของเบราว์เซอร์
    window.addEventListener('popstate', function(event) {
      loadPageFromURL();
    });

    // เรียกทำงานทันทีเมื่อเปิดหน้าเว็บ
    loadPageFromURL();
  </script>
</body>
</html>
