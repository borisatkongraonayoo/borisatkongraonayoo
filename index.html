<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบงานบริหารจัดการ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f5f7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="webappFrame" src="" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // 1. นำ URL ที่ลงท้ายด้วย /exec จากการ Deploy ใน Apps Script มาวางตรงนี้
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // อ่านค่า query parameter (?page=...) จาก URL ของ GitHub Pages
    const urlParams = new URLSearchParams(window.location.search);
    const page = urlParams.get('page') || 'tech';

    // กำหนด src ให้กับ iframe เพื่อโหลดหน้าเพจที่ต้องการ
    const iframe = document.getElementById('webappFrame');
    iframe.src = `${APPS_SCRIPT_EXEC_URL}?page=${page}`;
  </script>
</body>
</html>
